name: CI

on:
  push:
    branches: [main, master, "claude/**", "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (app + worker source)
        run: npx eslint src/lib src/pages src/hooks src/test src/constants worker shared --max-warnings 0

      - name: Typecheck (app)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck (worker)
        run: npx tsc -p tsconfig.worker.json --noEmit

      - name: Test
        run: npm test
